apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cartgo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: REPLACE_WITH_ECR_URI/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: USER_SERVICE_URL
          value: "http://user-service:8081"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8082"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:8083"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8084"
        - name: DELIVERY_SERVICE_URL
          value: "http://delivery-service:8086"
        - name: SUPPORT_SERVICE_URL
          value: "http://support-service:8087"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
---
# Application Load Balancer via Ingress Resource
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: cartgo
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cartgo
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: NodePort
