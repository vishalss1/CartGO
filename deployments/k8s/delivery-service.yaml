apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: cartgo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
      - name: delivery-service
        image: REPLACE_WITH_ECR_URI/delivery-service:latest
        ports:
        - containerPort: 8086
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: delivery-db-url
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: cartgo
spec:
  selector:
    app: delivery-service
  ports:
  - protocol: TCP
    port: 8086
    targetPort: 8086
  type: ClusterIP
